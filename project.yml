name: Trees
options:
  bundleIdPrefix: com.treetracker
  deploymentTarget:
    iOS: "17.0"
    watchOS: "11.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Trees:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: Trees
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    info:
      path: Trees/Info.plist
      properties:
        CFBundleDisplayName: Tree Tracker
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Only Apple's standard HTTPS is used (iCloud, MapKit), which is exempt
        # from export-compliance documentation
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: Tree Tracker needs your location to record precise GPS coordinates of trees you capture.
        NSLocationTemporaryUsageDescriptionDictionary:
          TreeCapture: Recording a tree needs your precise location. An approximate one can be several kilometres out.
        NSCameraUsageDescription: Tree Tracker uses the camera to take photos of trees for identification.
        NSPhotoLibraryUsageDescription: Tree Tracker needs access to your photos to attach existing images to tree records.
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        INFOPLIST_FILE: Trees/Info.plist
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: com.treetracker.Trees
        TARGETED_DEVICE_FAMILY: "1,2"
        # Macs get the iPad app as-is ("Designed for iPad", Apple silicon only)
        # rather than a separate Mac Catalyst build.
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Trees/Trees.entitlements
        DEVELOPMENT_TEAM: 3L3ASPMXH9
    postBuildScripts:
      - script: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "${BUILT_PRODUCTS_DIR}/${INFOPLIST_PATH}"
          # Stamp version into Settings.bundle
          SETTINGS_PLIST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Settings.bundle/Root.plist"
          if [ -f "${SETTINGS_PLIST}" ]; then
            /usr/libexec/PlistBuddy -c "Set :PreferenceSpecifiers:1:DefaultValue ${MARKETING_VERSION} (${BUILD_NUMBER})" "${SETTINGS_PLIST}"
          fi
        name: Set Build Number from Git
        basedOnDependencyAnalysis: false
    dependencies:
      - target: TreesWatch
        embed: true
        platformFilter: iOS

  TreesWatch:
    type: application
    platform: watchOS
    sources:
      - path: TreesWatch
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    info:
      path: TreesWatch/Info.plist
      properties:
        CFBundleDisplayName: Tree Tracker
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.treetracker.Trees
        WKRunsIndependentlyOfCompanionApp: true
        NSLocationWhenInUseUsageDescription: Tree Tracker needs your location to record GPS coordinates of trees.
    settings:
      base:
        INFOPLIST_FILE: TreesWatch/Info.plist
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: com.treetracker.Trees.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3L3ASPMXH9
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
    postBuildScripts:
      - script: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "${BUILT_PRODUCTS_DIR}/${INFOPLIST_PATH}"
        name: Set Build Number from Git
        basedOnDependencyAnalysis: false
    dependencies:
      - target: TreesWatchWidget
        embed: true

  TreesWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: TreesWatchWidget
        excludes:
          - "**/.DS_Store"
    info:
      path: TreesWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Tree Tracker
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        INFOPLIST_FILE: TreesWatchWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.treetracker.Trees.watchkitapp.widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3L3ASPMXH9
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    postBuildScripts:
      - script: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "${BUILT_PRODUCTS_DIR}/${INFOPLIST_PATH}"
        name: Set Build Number from Git
        basedOnDependencyAnalysis: false

  TreesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TreesTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Trees
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.treetracker.TreesTests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3L3ASPMXH9

schemes:
  Trees:
    shared: true
    build:
      targets:
        Trees: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TreesTests
    archive:
      config: Release
